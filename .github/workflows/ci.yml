name: CI

permissions:
  contents: read

on:
  push:
    branches: ['*', '!main']
    paths-ignore: ['**/*.md', 'LICENSE', '.python-version', 'examples/*']

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.35.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Install dependencies
        run: rye sync --all-features

      - name: Run linters
        run: rye run lint

      - name: Ensure importability
        run: rye run demo

      - name: Run tests in Python 3.11
        run: rye run pytest

      - name: Build local distribution
        run: rye build --clean

      - name: Persist build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  ecosystem-test:
    needs: unit-test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build from artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Install package
        run: |
          whl="$(ls cspark-*.whl)"
          # The mcp extra requires Python 3.10+. Older interpreters still install the base wheel.
          if python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; then
            pip install "./${whl}[mcp]"
          else
            pip install "./${whl}"
          fi

      - name: Ensure importability
        run: python examples/main.py

      - name: Run tests
        run: |
          pip install pytest uvicorn anyio trio
          # PyJWT 2.10+ needs Python 3.9. On 3.7/3.8, newer cryptography only
          # warns that the interpreter is deprecated, and this suite treats warnings as errors.
          if python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'; then
            pip install 'pyjwt[crypto]>=2.10.0'
          elif python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)'; then
            pip install 'pyjwt[crypto]>=2.9,<2.10' 'cryptography>=3.4,<47'
          else
            pip install 'pyjwt[crypto]>=2.8,<2.9' 'cryptography>=3.4,<44'
          fi
          pytest test/ -v
